[Chainloader]
; Mewjector v3.5 config for the mewgenics-mods project.
; Copy this file and Mewjector's version.dll next to Mewgenics.exe (see tools/install-mewjector.bat).
; install-mewjector.bat substitutes __REPO__ with this repo's absolute path at install time.
; Mod DLLs are loaded from this repo's native/dist folder, never from the game directory.
ScanPath=__REPO__\native\dist
ScanGameDir=0
MewtatorManifest=
Enabled=1
Logging=1
EnableEPFallback=

[LoadOrder]
; Mod1-Mod9 are reserved by Mewjector for framework DLLs it knows about.
; Pin our framework ahead of the alphabetical scan so mods can resolve its exports in their DllMain.
Mod10=mewframework.dll
