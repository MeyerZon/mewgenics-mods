<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="100%" style="stop-color:#3060c0"/>
    </linearGradient>
    <radialGradient id="base">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.5" stop-color="#ff0000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glow" xlink:href="#base" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="30" spreadMethod="reflect"/>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="turned" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="10" y2="0" gradientTransform="scale(2)">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="50" fill="url(#sky)"/>
  <circle cx="100" cy="100" r="40" fill="url(#glow)"/>
  <rect x="300" y="10" width="50" height="20" fill="url(#box)"/>
  <rect x="0" y="150" width="40" height="40" fill="url('#turned')"/>
</svg>
